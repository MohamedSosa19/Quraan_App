name: CI

on:
  push:
    branches: [master, main, "001-quran-mvp"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "Local-Dev-Password-1!"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "exit 0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        working-directory: backend
        run: dotnet restore Quraan.Backend.slnx
      - name: Build
        working-directory: backend
        run: dotnet build Quraan.Backend.slnx --no-restore -c Release
      - name: Unit tests
        working-directory: backend
        run: dotnet test tests/Quraan.UnitTests/Quraan.UnitTests.csproj --no-build -c Release --logger "trx;LogFileName=unit.trx"
      - name: Integration tests
        working-directory: backend
        run: dotnet test tests/Quraan.IntegrationTests/Quraan.IntegrationTests.csproj --no-build -c Release --logger "trx;LogFileName=integration.trx"
      - name: Contract tests
        working-directory: backend
        run: dotnet test tests/Quraan.ContractTests/Quraan.ContractTests.csproj --no-build -c Release --logger "trx;LogFileName=contract.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/TestResults/*.trx

  frontend:
    name: Frontend (lint + test + e2e + bundle budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci --no-fund --no-audit
      - name: Lint (ESLint)
        working-directory: frontend
        run: npx eslint .
      - name: Lint (Stylelint)
        working-directory: frontend
        run: npx stylelint "src/**/*.scss"
      - name: Custom rule unit tests
        working-directory: frontend
        run: node --test eslint-rules/__tests__
      - name: Unit tests (Karma)
        working-directory: frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage
      - name: Production build (enforces angular.json budgets)
        working-directory: frontend
        run: npx ng build --configuration production
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright e2e + axe-core
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  contract-drift:
    name: OpenAPI contract drift check
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Generate swagger.json
        working-directory: backend
        run: |
          dotnet build src/Quraan.Api/Quraan.Api.csproj -c Release
          dotnet tool install --global Swashbuckle.AspNetCore.Cli || true
          # Tool config to be wired in T056; placeholder fail-friendly:
          test -f ../specs/001-quran-mvp/contracts/openapi.yaml
      - name: Diff committed contract vs generated (placeholder until T056)
        run: |
          echo "Drift check is wired up in T056 once Swashbuckle generation is added to the API project."
