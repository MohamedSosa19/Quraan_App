<header class="app-shell__header">
  <a class="app-shell__brand" routerLink="/">
    <strong>{{ 'app.title' | translate }}</strong>
  </a>
  <nav class="app-shell__nav" aria-label="Primary">
    <a routerLink="/surahs">{{ 'nav.surahs' | translate }}</a>
  </nav>
  <button type="button" class="app-shell__lang" (click)="switchLanguage()">
    {{ currentLang === 'ar' ? 'English' : 'العربية' }}
  </button>
</header>

<main class="app-shell__main">
  <router-outlet />
</main>
